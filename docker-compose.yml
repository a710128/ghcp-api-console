x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-database-env: &database-env
  DATABASE_URL: postgres://${POSTGRES_USER:-ghcp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ghcp}
  DB_APPLICATION_NAME: ${DB_APPLICATION_NAME:-ghcp}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  LOGIN_JOB_ENCRYPTION_KEY: ${LOGIN_JOB_ENCRYPTION_KEY:?set LOGIN_JOB_ENCRYPTION_KEY}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ghcp}
      POSTGRES_USER: ${POSTGRES_USER:-ghcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    command: >
      postgres
      -c max_connections=100
      -c superuser_reserved_connections=10
      -c log_connections=off
      -c log_min_duration_statement=5000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghcp} -d ${POSTGRES_DB:-ghcp}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  db-migrate:
    image: ghcp-login:local
    entrypoint: ["node", "/app/src/packages/database/dist/cli/migrate.js"]
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - internal

  sso:
    build:
      context: .
      dockerfile: src/sso/Dockerfile
    image: ghcp-sso:local
    environment:
      PORT: "7001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *database-env
      DB_POOL_SIZE: "8"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      BASE_URL: https://${SSO_HOST:?set SSO_HOST}
      PROXY_BASE_URL: http://proxy-lb:3000
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SSO_EMAIL_DOMAIN: ${SSO_EMAIL_DOMAIN:-customsso.com}
      USER_PREFIX: ${USER_PREFIX:-user}
      ENTERPRISE_SLUG: ${ENTERPRISE_SLUG:?set ENTERPRISE_SLUG}
      ENTERPRISE_SHORTCODE: ${ENTERPRISE_SHORTCODE:-octo}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_COPILOT_SEAT_PAT: ${GITHUB_COPILOT_SEAT_PAT:-}
      SCIM_BASE_URL: ${SCIM_BASE_URL:?set SCIM_BASE_URL}
      SCIM_TOKEN: ${SCIM_TOKEN:?set SCIM_TOKEN}
      SCIM_REQUEST_DELAY_MS: ${SCIM_REQUEST_DELAY_MS:-250}
      SCIM_MAX_RETRIES: ${SCIM_MAX_RETRIES:-3}
      SCIM_RETRY_BASE_DELAY_MS: ${SCIM_RETRY_BASE_DELAY_MS:-1000}
      SP_ENTITY_ID: ${SP_ENTITY_ID:?set SP_ENTITY_ID}
      SP_ACS_URL: ${SP_ACS_URL:?set SP_ACS_URL}
      CERT_DIR: /certs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sso.rule=Host(`${SSO_HOST}`)"
      - "traefik.http.routers.sso.tls=true"
      - "traefik.http.routers.sso.tls.certresolver=le"
      - "traefik.http.routers.sso.entrypoints=websecure"
      - "traefik.http.services.sso.loadbalancer.server.port=7001"
    volumes:
      - ${SSO_CERT_DIR:-./certs}:/certs:ro
      - console-data:/data
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  login:
    build:
      context: .
      dockerfile: src/login/Dockerfile
    image: ghcp-login:local
    environment:
      PORT: "7003"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *database-env
      DB_POOL_SIZE: "5"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      PROXY_BASE_URL: http://proxy-lb:3000
      LOGIN_CONCURRENCY: "1"
      LOGIN_WORKER_CONCURRENCY: "1"
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-Ov23li8tweQw6odWQebz}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-read:user}
      OPENCODE_USER_AGENT: ${OPENCODE_USER_AGENT:-opencode/1.0}
      SSO_URL: https://${SSO_HOST:?set SSO_HOST}/login
      SSO_PROVIDER: ${LOGIN_SSO_PROVIDER:-custom}
      AUTH_HEADLESS: ${AUTH_HEADLESS:-true}
      AUTH_TIMEOUT_MS: ${AUTH_TIMEOUT_MS:-60000}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7003/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  login-worker:
    build:
      context: .
      dockerfile: src/login/Dockerfile
    image: ghcp-login:local
    entrypoint: ["node", "worker.js"]
    working_dir: /app/src/login/dist
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *database-env
      DB_POOL_SIZE: "3"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      PROXY_BASE_URL: http://proxy-lb:3000
      LOGIN_WORKER_CONCURRENCY: "1"
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-Ov23li8tweQw6odWQebz}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-read:user}
      OPENCODE_USER_AGENT: ${OPENCODE_USER_AGENT:-opencode/1.0}
      SSO_URL: https://${SSO_HOST:?set SSO_HOST}/login
      SSO_PROVIDER: ${LOGIN_SSO_PROVIDER:-custom}
      AUTH_HEADLESS: ${AUTH_HEADLESS:-true}
      AUTH_TIMEOUT_MS: ${AUTH_TIMEOUT_MS:-60000}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      login:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  proxy:
    build:
      context: .
      dockerfile: src/proxy/Dockerfile
    image: ghcp-proxy:local
    # Replicas are fronted by proxy-lb (no host port here). Safe to scale because
    # proxy is stateless and account init is serialized by a PostgreSQL advisory lock.
    deploy:
      replicas: 2
    environment:
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *database-env
      DB_POOL_SIZE: "10"
      API_KEY: ${API_KEY:?set API_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      IDENTITY_HEADER: ${IDENTITY_HEADER:-X-User-Identity}
      IDENTITY_HEADER_REQUIRED: "${IDENTITY_HEADER_REQUIRED:-true}"
      CLAUDE_CODE_OPTIMIZED: "${CLAUDE_CODE_OPTIMIZED:-true}"
      SSO_BASE_URL: http://sso:7001
      LOGIN_BASE_URL: http://login:7003
      ENTERPRISE_SHORTCODE: ${ENTERPRISE_SHORTCODE:-octo}
      EDITOR_VERSION: ${EDITOR_VERSION:-vscode/1.124.2}
      EDITOR_PLUGIN_VERSION: ${EDITOR_PLUGIN_VERSION:-copilot-chat/0.52.0}
      USER_AGENT: ${USER_AGENT:-GitHubCopilotChat/0.52.0}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2025-04-01}
      COPILOT_INTEGRATION_ID: ${COPILOT_INTEGRATION_ID:-vscode-chat}
      VSCODE_SESSION_ID: "${VSCODE_SESSION_ID:-}"
      VSCODE_MACHINE_ID: "${VSCODE_MACHINE_ID:-}"
      EDITOR_DEVICE_ID: "${EDITOR_DEVICE_ID:-}"
      CLAUDE_CODE_GITHUB_API_VERSION: ${CLAUDE_CODE_GITHUB_API_VERSION:-2026-01-09}
    # labels disabled for 方案 A: proxy 走宿主机端口 3000 内网直连，不经 Traefik
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.proxy.rule=Host(`${PROXY_HOST:?set PROXY_HOST}`)"
    #   - "traefik.http.routers.proxy.entrypoints=web,websecure"
    #   - "traefik.http.services.proxy.loadbalancer.server.port=3000"
    depends_on:
      sso:
        condition: service_healthy
      login:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  proxy-lb:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./scripts/proxy-lb.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/lb-healthz"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  console:
    build:
      context: .
      dockerfile: src/console/Dockerfile
    image: ghcp-console:local
    ports:
      - "8004:7004"
    environment:
      PORT: "7004"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMINS_FILE: /data/admins.json
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      PROXY_BASE_URL: http://proxy-lb:3000
      SSO_BASE_URL: http://sso:7001
      LOGIN_BASE_URL: http://login:7003
    # labels disabled for 方案 A: console 走宿主机端口 7004 内网直连，不经 Traefik
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.console.rule=Host(`${CONSOLE_HOST:?set CONSOLE_HOST}`)"
    #   - "traefik.http.routers.console.entrypoints=web,websecure"
    #   - "traefik.http.services.console.loadbalancer.server.port=7004"
    volumes:
      - console-data:/data
    depends_on:
      proxy-lb:
        condition: service_healthy
      sso:
        condition: service_healthy
      login:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7004/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  traefik:
    image: traefik:v3.6.23
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=admin@aesaib9xahvireix.modelbest.cn"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    depends_on:
      - socket-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres-data:
  console-data:
  letsencrypt:

networks:
  internal:
    driver: bridge
