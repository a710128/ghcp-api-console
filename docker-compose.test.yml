# Test-only PostgreSQL 16 environment for integration tests.
# Runs on a separate port (5433) and uses isolated named volumes.
# Usage: docker compose -f docker-compose.test.yml up -d postgres-test
# Set TEST_DATABASE_URL=postgres://ghcp_test:ghcp_test_password@localhost:5433/ghcp_test

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: ghcp_test
      POSTGRES_USER: ghcp_test
      POSTGRES_PASSWORD: ghcp_test_password
      POSTGRES_HOST_AUTH_METHOD: md5
    command: >
      postgres
      -c max_connections=50
      -c superuser_reserved_connections=3
      -c log_connections=on
      -c log_min_duration_statement=1000
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghcp_test -d ghcp_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-test-data:
