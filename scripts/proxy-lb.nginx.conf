# nginx L7 load balancer for the proxy service (2 replicas).
#
# Why nginx instead of Docker's built-in DNS round-robin:
#   - Active health checks via passive failure detection (max_fails/fail_timeout):
#     if one proxy replica dies, nginx stops sending traffic to it and retries
#     the request on the healthy replica (proxy_next_upstream) — real failover.
#   - Docker's embedded DNS returns all replica IPs but does no health checking,
#     so a dead replica would still receive ~50% of requests until it is removed.
#
# The proxy service is stateful only in shared PostgreSQL, so every replica is
# interchangeable and round-robin is safe (account init is coordinated by a
# PostgreSQL advisory lock, see copilotAuthManager.initializeIdentityOnce).

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  access_log off;
  error_log /dev/stderr warn;

  # Match the backend proxy's Express body limit (express.json({ limit: '20mb' })
  # in src/proxy/src/server.ts). nginx defaults to 1MB, which would reject large
  # LLM request bodies (long chat history / system prompts / inlined file content
  # on /v1/messages, /v1/responses) with 413 before they ever reach the backend.
  client_max_body_size 20m;

  # Docker's embedded DNS resolver. Re-resolve replica IPs so that scaling /
  # restarting replicas is picked up without reloading nginx. 127.0.0.11 is the
  # fixed address of the Docker embedded DNS server on user-defined networks.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream proxy_backends {
    # `proxy` resolves (via Docker DNS) to the IPs of every proxy replica.
    # zone enables shared memory for dynamic re-resolution and health state.
    zone proxy_backends 64k;
    server proxy:3000 resolve max_fails=3 fail_timeout=15s;

    # Keep upstream connections warm to reduce per-request TCP/handshake cost.
    keepalive 32;
  }

  # Long timeouts: proxy forwards streaming (SSE) LLM responses that can run
  # for minutes. Do not cut them off mid-stream.
  proxy_connect_timeout 10s;
  proxy_send_timeout    600s;
  proxy_read_timeout    600s;
  send_timeout          600s;

  server {
    listen 3000;

    # Health endpoint of the load balancer itself.
    location = /lb-healthz {
      return 200 "lb ok\n";
      default_type text/plain;
    }

    location / {
      proxy_pass http://proxy_backends;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Do not buffer streaming (SSE) responses.
      proxy_buffering off;
      proxy_request_buffering off;

      # Failover: if a replica is down or returns a connection-level error,
      # retry the request on the next healthy replica. Only retry idempotent
      # failure modes to avoid double-submitting a POST that was actually
      # processed. `non_idempotent` is intentionally NOT enabled.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 15s;
    }
  }
}
